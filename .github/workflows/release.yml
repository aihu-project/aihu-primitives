name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify exact release tag
        run: bun run check:version
      - name: Verify package
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run check:pack
      - name: Publish package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo '::error::NPM_TOKEN is required; refusing to publish.'
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org >/dev/null
          version=$(node -p "require('./package.json').version")
          lookup_log=$(mktemp)
          trap 'rm "$lookup_log"' EXIT
          lookup_rc=0
          npm view "@aihu/primitives@$version" version --registry=https://registry.npmjs.org >"$lookup_log" 2>&1 || lookup_rc=$?
          if [ "$lookup_rc" -eq 0 ]; then
            echo '::notice::This package version is already published; release is idempotently complete.'
            exit 0
          fi
          if ! grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$lookup_log"; then
            cat "$lookup_log"
            echo '::error::NPM version lookup failed without a confirmed E404; refusing to publish.'
            exit "$lookup_rc"
          fi
          npm publish --access public --provenance
