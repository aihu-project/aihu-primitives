name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify exact release tag
        run: bun run check:version
      - name: Verify package
        run: |
          bun run typecheck
          bun run test
          bun run build
          bun run check:pack
      - name: Publish package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo '::error::NPM_TOKEN is required; refusing to publish.'
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if npm view "@aihu/primitives@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo '::notice::This package version is already published; release is idempotently complete.'
            exit 0
          fi
          npm publish --access public --provenance
