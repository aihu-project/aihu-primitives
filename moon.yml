# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: typescript
layer: library

# This package is standalone. Its published @aihu/signals and @aihu/arbor
# dependencies are installed from npm before typecheck/build in CI.
tasks:
  build:
    command: "bunx rolldown -c"
    inputs:
      - "src/**/*.ts"
      - "src/**/*.aihu"
      - "rolldown.config.ts"
    outputs:
      - "dist"
    options:
      mergeArgs: "replace"

  typecheck:
    command: "bunx tsc --noEmit"
    inputs:
      - "src/**/*.ts"
      - "tests/**/*"
    deps:
      - "~:build"

  test:
    command: "bunx vitest run"
    inputs:
      - "src/**/*.ts"
      - "tests/**/*"
    deps:
      - "~:build"
